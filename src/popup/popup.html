<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scholar Rank</title>
  <link rel="stylesheet" href="../content/badges.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Scholar Rank</strong>
    <label class="switch">
      <input type="checkbox" id="enabled" aria-label="Enable Scholar Rank">
      <span></span>
    </label>
  </header>

  <div class="preview">
    <div id="preview" class="sr-badges">
      <span class="sr-preview-label">Conference</span>
      <span class="sr-badge sr-conference">CVPR</span>
      <span class="sr-badge sr-ccf-a">CCF A</span>
      <span class="sr-badge sr-core-astar">CORE A*</span>
      <span class="sr-preview-label">Journal</span>
      <span class="sr-badge sr-journal">TIFS</span>
      <span class="sr-badge sr-top">TOP</span>
      <span class="sr-badge sr-q1">JCR Q1</span>
      <span class="sr-badge sr-zone-1">CAS 1</span>
      <span class="sr-badge sr-if">IF 8.7</span>
    </div>
  </div>

  <label class="field">
    <span>Appearance</span>
    <select id="theme"></select>
  </label>

  <div id="status" class="status">—</div>

  <footer>
    <button id="openOptions">Open settings</button>
  </footer>

  <script src="../lib/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
